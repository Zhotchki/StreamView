<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>StreamView</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{display:flex;align-items:center;padding:13px;background:#13171c;position:sticky;top:0;z-index:5}.brand{flex:1;font-size:20px;font-weight:800}.ver{font-size:11px;color:#929aa4}
.btn{border:0;border-radius:11px;background:#272d34;color:#fff;padding:11px 13px;font-weight:700;min-height:44px}.primary{background:#fff;color:#111}.btn:disabled{opacity:.4}
main{max-width:900px;margin:auto;padding:10px}.player{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}video{width:100%;height:100%;display:block}
.now{font-weight:750;padding:10px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#15191e;border:1px solid #2a3037;border-radius:15px;padding:12px;margin-bottom:10px}.label,.status{font-size:13px;color:#aab3bd}
.row{display:flex;gap:8px;margin-top:6px}input,select{width:100%;min-width:0;border:1px solid #343b43;background:#0e1115;color:#fff;border-radius:11px;padding:12px;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tabs{display:flex;gap:7px;margin:8px 0}.tabs .btn{flex:1}.active{background:#fff!important;color:#111!important}
.list{display:grid;gap:6px;max-height:48vh;overflow:auto}.item{display:flex;align-items:center;gap:8px;background:#0e1115;border:1px solid #282e35;border-radius:11px;padding:9px}
.info{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:12px;color:#929aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;color:#fff;font-size:22px}.hidden{display:none}.selected{border-color:#fff}.sport{font-size:11px;color:#c2cad3;margin-top:2px}
@media(orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.list{max-height:calc(100dvh - 230px)}}
</style></head><body>
<header><div class="brand">StreamView <span class="ver">v1.1</span></div><button class="btn" id="settingsBtn">Settings</button></header>
<main><section>
<div class="player"><video id="video" playsinline controls preload="metadata"></video></div>
<div class="now" id="now">Choose a channel</div>
<div class="actions"><button class="btn primary" id="watch" disabled>▶ Watch</button><button class="btn" id="cast" disabled>📺 Cast to TV</button></div>
</section><section>
<div class="card" id="settings"><div class="label">Uzzu app2 playlist URL</div><div class="row"><input id="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email"><button class="btn primary" id="import">Import</button></div><p class="status" id="status">Your personal playlist address is stored only in this browser.</p></div>
<div class="card">
<div class="filters"><input id="search" type="search" placeholder="Search teams/channels" disabled><select id="sport" disabled><option value="">All sports</option></select></div>
<div class="tabs"><button class="btn active" data-tab="all">All</button><button class="btn" data-tab="fav">Favorites</button><button class="btn" data-tab="recent">Recent</button></div>
<div class="list" id="list"><div class="status">Import your playlist to load channels.</div></div>
</div></section></main>
<script>
(()=>{const $=s=>document.querySelector(s),PROXY='https://dualview-proxy.zhotchki.workers.dev/?url=';
let channels=[],selected=null,tab='all';const video=$('#video'),list=$('#list'),status=$('#status'),search=$('#search'),sport=$('#sport');
let fav=new Set(JSON.parse(localStorage.getItem('sv_fav')||'[]')),recent=JSON.parse(localStorage.getItem('sv_recent')||'[]');

function safe(x){try{let u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return''}}
function sportOf(c){
 const s=(c.group+' '+c.name).toLowerCase();
 const tests=[['NFL / Football',/\bnfl\b|football|redzone|red zone/],['College Football',/\bncaa\b|college football|\bcfb\b/],['MLB / Baseball',/\bmlb\b|baseball/],['NBA / Basketball',/\bnba\b|basketball/],['College Basketball',/college basketball|\bncaab\b/],['NHL / Hockey',/\bnhl\b|hockey/],['Soccer',/soccer|premier league|\bepl\b|champions league|\bmls\b|fifa|la liga|serie a|bundesliga/],['Golf',/\bpga\b|golf|liv golf/],['UFC / MMA',/\bufc\b|\bmma\b/],['Tennis',/tennis|\batp\b|\bwta\b/],['Racing',/\bnascar\b|formula 1|\bf1\b|indycar|racing/]];
 for(const [n,r] of tests)if(r.test(s))return n;
 return c.group.trim()||'Other';
}
function parse(t){let out=[],m=null;for(let r of t.replace(/\r/g,'').split('\n')){let l=r.trim();if(!l)continue;if(l.startsWith('#EXTINF:')){let c=l.lastIndexOf(',');m={name:(c>=0?l.slice(c+1):'Channel').trim()||'Channel',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||''}}else if(!l.startsWith('#')&&m){let u=safe(l);if(u){let x={...m,url:u};x.sport=sportOf(x);out.push(x)}m=null}}return out}
function addRecent(c){recent=[c.url,...recent.filter(x=>x!==c.url)].slice(0,15);localStorage.setItem('sv_recent',JSON.stringify(recent))}
function buildSports(){let cur=sport.value;let sports=[...new Set(channels.map(c=>c.sport))].sort();sport.innerHTML='<option value="">All sports</option>';for(let x of sports){let o=document.createElement('option');o.value=x;o.textContent=x;sport.appendChild(o)}if(sports.includes(cur))sport.value=cur}
function visible(){let q=search.value.trim().toLowerCase(),sp=sport.value,a=channels;if(tab==='fav')a=a.filter(c=>fav.has(c.url));if(tab==='recent')a=recent.map(u=>channels.find(c=>c.url===u)).filter(Boolean);return a.filter(c=>(!sp||c.sport===sp)&&(!q||(c.name+' '+c.group+' '+c.sport).toLowerCase().includes(q)))}
function choose(c){selected=c;$('#now').textContent=c.name+(c.group?' • '+c.group:'');$('#watch').disabled=false;$('#cast').disabled=false;status.textContent='Selected: '+c.name;addRecent(c);render()}
function render(){list.innerHTML='';let a=visible();if(!a.length){list.innerHTML='<div class="status">No streams match this filter.</div>';return}for(let c of a){let r=document.createElement('div');r.className='item'+(selected&&selected.url===c.url?' selected':'');let i=document.createElement('div');i.className='info';let t=document.createElement('div');t.className='title';t.textContent=c.name;let g=document.createElement('div');g.className='group';g.textContent=c.group||'Channel';let sp=document.createElement('div');sp.className='sport';sp.textContent=c.sport;i.append(t,g,sp);i.onclick=()=>choose(c);let s=document.createElement('button');s.className='star';s.textContent=fav.has(c.url)?'★':'☆';s.onclick=e=>{e.stopPropagation();fav.has(c.url)?fav.delete(c.url):fav.add(c.url);localStorage.setItem('sv_fav',JSON.stringify([...fav]));render()};let b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=e=>{e.stopPropagation();choose(c)};r.append(i,s,b);list.append(r)}}
async function imp(){let u=safe($('#url').value.trim());if(!u){status.textContent='Enter a valid https:// app2 playlist URL.';return}$('#import').disabled=true;status.textContent='Importing…';try{let r=await fetch(PROXY+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error(r.status);channels=parse(await r.text());if(!channels.length)throw Error('No channels');localStorage.setItem('streamview_playlist_url',u);search.disabled=false;sport.disabled=false;buildSports();render();status.textContent='Imported '+channels.length+' streams. Tap a stream or Select.'}catch(e){console.error(e);status.textContent='Playlist import failed. Check the address and try again.'}finally{$('#import').disabled=false}}
$('#import').onclick=imp;$('#watch').onclick=()=>{if(!selected)return;video.pause();video.src=selected.url;video.load();video.play().catch(e=>{console.error(e);status.textContent='The stream could not start automatically. Tap Play in the video player.'});addRecent(selected)};
$('#cast').onclick=()=>{if(selected)status.textContent='Selected stream is ready. Roku casting is the next compatibility step.'};
search.oninput=render;sport.onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');let saved=localStorage.getItem('streamview_playlist_url');if(saved)$('#url').value=saved;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
