<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>StreamView</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}header{display:flex;align-items:center;padding:13px;background:#13171c;position:sticky;top:0;z-index:5}.brand{flex:1;font-size:20px;font-weight:800}.ver{font-size:11px;color:#929aa4}.btn{border:0;border-radius:11px;background:#272d34;color:#fff;padding:11px 13px;font-weight:700;min-height:44px}.primary{background:#fff;color:#111}.btn:disabled{opacity:.4}main{max-width:900px;margin:auto;padding:10px}.player{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}video{width:100%;height:100%;display:block}.now{font-weight:750;padding:10px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.card{background:#15191e;border:1px solid #2a3037;border-radius:15px;padding:12px;margin-bottom:10px}.label,.status{font-size:13px;color:#aab3bd}.row{display:flex;gap:8px;margin-top:6px}input{width:100%;min-width:0;border:1px solid #343b43;background:#0e1115;color:#fff;border-radius:11px;padding:12px;font-size:16px}.tabs{display:flex;gap:7px;margin:8px 0}.tabs .btn{flex:1}.active{background:#fff!important;color:#111!important}.list{display:grid;gap:6px;max-height:45vh;overflow:auto}.item{display:flex;align-items:center;gap:8px;background:#0e1115;border:1px solid #282e35;border-radius:11px;padding:9px}.info{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:12px;color:#929aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{border:0;background:none;color:#fff;font-size:22px}.hidden{display:none}.search{margin-bottom:4px}@media(orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.list{max-height:calc(100dvh - 190px)}}
</style></head><body><header><div class="brand">StreamView <span class="ver">v1.0</span></div><button class="btn" id="settingsBtn">Settings</button></header><main><section><div class="player"><video id="video" playsinline controls preload="metadata"></video></div><div class="now" id="now">Choose a channel</div><div class="actions"><button class="btn primary" id="watch" disabled>▶ Watch</button><button class="btn" id="cast" disabled>📺 Cast to TV</button></div></section><section><div class="card" id="settings"><div class="label">Uzzu app2 playlist URL</div><div class="row"><input id="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email"><button class="btn primary" id="import">Import</button></div><p class="status" id="status">Your personal playlist address is stored only in this browser.</p></div><div class="card"><input class="search" id="search" type="search" placeholder="Search channels or teams" disabled><div class="tabs"><button class="btn active" data-tab="all">All</button><button class="btn" data-tab="fav">Favorites</button><button class="btn" data-tab="recent">Recent</button></div><div class="list" id="list"><div class="status">Import your playlist to load channels.</div></div></div></section></main><script>
(()=>{const $=s=>document.querySelector(s),PROXY='https://dualview-proxy.zhotchki.workers.dev/?url=';let channels=[],selected=null,tab='all';const video=$('#video'),list=$('#list'),status=$('#status'),search=$('#search');let fav=new Set(JSON.parse(localStorage.getItem('sv_fav')||'[]')),recent=JSON.parse(localStorage.getItem('sv_recent')||'[]');function safe(x){try{let u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return''}}function parse(t){let out=[],m=null;for(let r of t.replace(/\r/g,'').split('\n')){let l=r.trim();if(!l)continue;if(l.startsWith('#EXTINF:')){let c=l.lastIndexOf(',');m={name:(c>=0?l.slice(c+1):'Channel').trim()||'Channel',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||''}}else if(!l.startsWith('#')&&m){let u=safe(l);if(u)out.push({...m,url:u});m=null}}return out}function addRecent(c){recent=[c.url,...recent.filter(x=>x!==c.url)].slice(0,12);localStorage.setItem('sv_recent',JSON.stringify(recent))}function visible(){let q=search.value.trim().toLowerCase(),a=channels;if(tab==='fav')a=a.filter(c=>fav.has(c.url));if(tab==='recent')a=recent.map(u=>channels.find(c=>c.url===u)).filter(Boolean);return a.filter(c=>!q||(c.name+' '+c.group).toLowerCase().includes(q))}function render(){list.innerHTML='';let a=visible();if(!a.length){list.innerHTML='<div class="status">No channels found.</div>';return}for(let c of a){let r=document.createElement('div');r.className='item';let i=document.createElement('div');i.className='info';i.innerHTML='<div class="title"></div><div class="group"></div>';i.children[0].textContent=c.name;i.children[1].textContent=c.group||'Channel';let s=document.createElement('button');s.className='star';s.textContent=fav.has(c.url)?'★':'☆';s.onclick=()=>{fav.has(c.url)?fav.delete(c.url):fav.add(c.url);localStorage.setItem('sv_fav',JSON.stringify([...fav]));render()};let b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=()=>{selected=c;$('#now').textContent=c.name+(c.group?' • '+c.group:'');$('#watch').disabled=$('#cast').disabled=false;status.textContent='Selected: '+c.name;addRecent(c)};r.append(i,s,b);list.append(r)}}async function imp(){let u=safe($('#url').value.trim());if(!u){status.textContent='Enter a valid https:// app2 playlist URL.';return}$('#import').disabled=true;status.textContent='Importing…';try{let r=await fetch(PROXY+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error(r.status);channels=parse(await r.text());if(!channels.length)throw Error('No channels');localStorage.setItem('streamview_playlist_url',u);search.disabled=false;render();status.textContent='Imported '+channels.length+' channels.'}catch(e){status.textContent='Playlist import failed. Check the address and try again.'}finally{$('#import').disabled=false}}$('#import').onclick=imp;$('#watch').onclick=()=>{if(!selected)return;video.src=selected.url;video.load();video.play().catch(()=>{});addRecent(selected)};$('#cast').onclick=()=>{if(selected)status.textContent='Stream selected. Roku casting will be enabled after the playback compatibility test.'};search.oninput=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');let saved=localStorage.getItem('streamview_playlist_url');if(saved)$('#url').value=saved;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
