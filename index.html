<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>StreamView</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;overscroll-behavior-x:none;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{display:flex;align-items:center;padding:13px;background:#13171c;position:sticky;top:0;z-index:5}.brand{flex:1;font-size:20px;font-weight:800}.ver{font-size:11px;color:#929aa4}
.btn{border:0;border-radius:11px;background:#272d34;color:#fff;padding:11px 13px;font-weight:700;min-height:44px}.primary{background:#fff;color:#111}.btn:disabled{opacity:.4}
main{max-width:900px;margin:auto;padding:10px}.player{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}video{width:100%;height:100%;display:block}
.now{font-weight:750;padding:10px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#15191e;border:1px solid #2a3037;border-radius:15px;padding:12px;margin-bottom:10px}.label,.status{font-size:13px;color:#aab3bd}
.row{display:flex;gap:8px;margin-top:6px}input,select{width:100%;min-width:0;border:1px solid #343b43;background:#0e1115;color:#fff;border-radius:11px;padding:12px;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tabs{display:flex;gap:7px;margin:8px 0}.tabs .btn{flex:1}.active{background:#fff!important;color:#111!important}
.list{display:grid;gap:6px;max-height:48vh;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;touch-action:pan-y}.item{display:flex;align-items:center;min-width:0;overflow:hidden;touch-action:pan-y;gap:8px;background:#0e1115;border:1px solid #282e35;border-radius:11px;padding:9px}
.info{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:12px;color:#929aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;color:#fff;font-size:22px}.hidden{display:none}.selected{border-color:#fff}.sport{font-size:11px;color:#c2cad3;margin-top:2px}.nowplaying{font-size:13px;color:#e8edf2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowplaying.liveNow{font-weight:800}
@media(orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.list{max-height:calc(100dvh - 230px)}}
</style></head><body>
<header><div class="brand">StreamView <span class="ver">v1.7.1</span></div><button class="btn" id="settingsBtn">Settings</button></header>
<main><section>
<div class="player"><video id="video" playsinline controls preload="metadata" x-webkit-airplay="allow"></video></div>
<div class="now" id="now">Choose a channel</div>
<div class="status" style="padding:0 2px 10px">Tap a stream below to play it. Use the AirPlay/output button inside the video controls to send video directly to your TV.</div>
</section><section>
<div class="card" id="settings"><div class="label">Uzzu app2 playlist URL</div><div class="row"><input id="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email"><button class="btn primary" id="import">Import</button></div><p class="status" id="status">Your personal playlist address is stored only in this browser.</p></div>
<div class="card">
<div class="filters"><input id="search" type="search" placeholder="Search teams/channels" disabled><select id="sport" disabled><option value="">All sports</option></select></div><div style="margin-bottom:8px"><select id="league" disabled><option value="">All leagues</option></select></div>
<div class="tabs"><button class="btn active" data-tab="all">All</button><button class="btn" data-tab="fav">Favorites</button><button class="btn" data-tab="recent">Recent</button></div>
<div class="list" id="list"><div class="status">Import your playlist to load channels.</div></div>
</div></section></main>
<script>
(()=>{const $=s=>document.querySelector(s),PROXY='/api/playlist?url=';
let channels=[],selected=null,tab='all',scheduleEvents=[],epgCandidates=[],epgFound=[];const video=$('#video'),list=$('#list'),status=$('#status'),search=$('#search'),sport=$('#sport'),league=$('#league');
let fav=new Set(JSON.parse(localStorage.getItem('sv_fav')||'[]')),recent=JSON.parse(localStorage.getItem('sv_recent')||'[]');

function safe(x){try{let u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return''}}
function classify(c){
 const x=(c.group+' '+c.name).toLowerCase();
 const rules=[
 ['Football','NFL',/\bnfl\b|redzone|red zone/],['Football','NCAA Football',/\bcfb\b|college football|ncaa football/],
 ['Baseball','MLB',/\bmlb\b|baseball/],['Basketball','NBA',/\bnba\b/],['Basketball','NCAA Basketball',/\bncaab\b|college basketball/],
 ['Hockey','NHL',/\bnhl\b|hockey/],['Golf','PGA / Golf',/\bpga\b|golf|liv golf/],['MMA','UFC / MMA',/\bufc\b|\bmma\b/],
 ['Soccer','MLS',/\bmls\b/],['Soccer','Premier League',/premier league|\bepl\b/],['Soccer','Champions League',/champions league/],
 ['Soccer','Soccer',/soccer|fifa|la liga|serie a|bundesliga/],['Tennis','Tennis',/tennis|\batp\b|\bwta\b/],
 ['Racing','NASCAR',/\bnascar\b/],['Racing','Formula 1',/formula 1|\bf1\b/],['Racing','Racing',/indycar|racing/]];
 for(const [sport,league,re] of rules)if(re.test(x))return {sport,league};
 return {sport:(c.group.trim()||'Other'),league:(c.group.trim()||'Other')};
}
const SCOREBOARDS={
 'NFL':'football/nfl','NCAA Football':'football/college-football','MLB':'baseball/mlb','NBA':'basketball/nba','NCAA Basketball':'basketball/mens-college-basketball','NHL':'hockey/nhl','MLS':'soccer/usa.1','Premier League':'soccer/eng.1','PGA / Golf':'golf/pga','UFC / MMA':'mma/ufc'
};
function norm(x){return (x||'').toLowerCase().replace(/\s*-\s*[ha]\s*$/i,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function teamKeys(team){let a=[];if(!team)return a;for(let k of ['name','shortDisplayName','displayName','abbreviation','location'])if(team[k])a.push(norm(team[k]));return [...new Set(a.filter(k=>k.length>=2))]}
function matchupParts(c){let raw=(c.name||'').replace(/\s*-\s*[HA]\s*$/i,'').trim();let p=raw.split(/\s+(?:@|at|vs\.?|v)\s+/i);return p.length===2?p.map(norm):[]}
function partMatchesTeam(part,team){if(!part)return false;return teamKeys(team).some(k=>part===k||part.endsWith(' '+k)||k.endsWith(' '+part)||part.includes(k))}
function matchEvent(c,e){let comp=e.competitions?.[0]?.competitors||[];if(comp.length<2)return false;let parts=matchupParts(c);if(parts.length===2){let t0=comp[0].team||{},t1=comp[1].team||{};return (partMatchesTeam(parts[0],t0)&&partMatchesTeam(parts[1],t1))||(partMatchesTeam(parts[0],t1)&&partMatchesTeam(parts[1],t0))}let n=norm(c.name+' '+c.group),hits=0;for(let x of comp){if(teamKeys(x.team).some(k=>n.includes(k)))hits++}return hits>=2}
function attachTimes(){for(let c of channels){c.game=null;let parts=matchupParts(c);let candidates=scheduleEvents.filter(e=>parts.length===2||!c.league||e._league===c.league).filter(e=>matchEvent(c,e));if(candidates.length){let now=Date.now(),state=e=>(e.competitions?.[0]?.status?.type||e.status?.type||{}).state||'',rank=e=>state(e)==='in'?0:new Date(e.date).getTime()>=now?1:2;candidates.sort((a,b)=>{let ar=rank(a),br=rank(b),at=new Date(a.date).getTime(),bt=new Date(b.date).getTime();return ar-br||(ar===1?at-bt:bt-at)});c.game=candidates[0]}}}
function timeLabel(c){let e=c.game;if(!e)return '';let st=e.competitions?.[0]?.status?.type||e.status?.type||{};let state=st.state||'';if(state==='in')return 'LIVE';let d=new Date(e.date);if(isNaN(d))return '';let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()),diff=Math.round((day-today)/86400000);let prefix=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});return prefix+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
async function loadSchedules(){scheduleEvents=[];let core=['NFL','NCAA Football','MLB','NBA','NCAA Basketball','NHL'];let leagues=[...new Set([...core,...channels.map(c=>c.league)].filter(l=>SCOREBOARDS[l]))];let now=new Date(),to=new Date(now.getTime()+8*86400000);let f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),range=f(new Date(now.getTime()-86400000))+'-'+f(to);await Promise.all(leagues.map(async l=>{try{let ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
let r=await fetch('/api/schedule?sport='+encodeURIComponent(SCOREBOARDS[l])+'&dates='+encodeURIComponent(range),{cache:'no-store',signal:ctl.signal});
clearTimeout(tm);if(!r.ok)return;let j=await r.json();for(let e of (j.events||[])){e._league=l;scheduleEvents.push(e)}}catch(e){console.warn('Schedule unavailable',l,e)}}));attachTimes()}
let epgSource='';function parse(t){let out=[],m=null;let h=t.match(/^#EXTM3U[^\n]*?(?:x-tvg-url|url-tvg)\s*=\s*(?:"([^"]+)"|'([^']+)'|([^\s]+))/im);if(h)epgSource=safe(h[1]||h[2]||h[3]||'');for(let r of t.replace(/\r/g,'').split('\n')){let l=r.trim();if(!l)continue;if(l.startsWith('#EXTINF:')){let c=l.lastIndexOf(',');m={name:(c>=0?l.slice(c+1):'Channel').trim()||'Channel',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||'',tvgId:(l.match(/tvg-id="([^"]*)"/i)||[])[1]||'',tvgName:(l.match(/tvg-name="([^"]*)"/i)||[])[1]||''}}else if(!l.startsWith('#')&&m){let u=safe(l);if(u){let x={...m,url:u};let cl=classify(x);x.sport=cl.sport;x.league=cl.league;out.push(x)}m=null}}return out}
async function loadEpg(url){let r=await fetch('/api/epg?url='+encodeURIComponent(url),{cache:'no-store'});if(!r.ok)throw Error('EPG '+r.status);let xml=await r.text(),doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw Error('Invalid EPG');let programs=[...doc.querySelectorAll('programme')],now=Date.now(),byId=new Map();for(let p of programs){let id=p.getAttribute('channel')||'',start=new Date(p.getAttribute('start')||''),stop=new Date(p.getAttribute('stop')||'');if(!id||isNaN(start)||isNaN(stop)||stop.getTime()<now||start.getTime()>now)continue;let title=p.querySelector('title')?.textContent?.trim()||'';if(title)byId.set(id,{title,start,stop})}for(let ch of channels){if(!((ch.group||'').toLowerCase().includes('live channel')))continue;let prog=byId.get(ch.tvgId||'');if(!prog&&ch.tvgName){let n=ch.tvgName.toLowerCase(),entry=[...doc.querySelectorAll('channel')].find(x=>[...x.querySelectorAll('display-name')].some(y=>(y.textContent||'').trim().toLowerCase()===n));if(entry)prog=byId.get(entry.getAttribute('id')||'')}if(!prog){let n=ch.name.toLowerCase(),entry=[...doc.querySelectorAll('channel')].find(x=>[...x.querySelectorAll('display-name')].some(y=>{let z=(y.textContent||'').trim().toLowerCase();return z===n||n.includes(z)||z.includes(n)}));if(entry)prog=byId.get(entry.getAttribute('id')||'')}if(prog){ch.epgNow=prog;ch.epgMatchType='direct';ch.epgGuideId=prog.id||ch.tvgId||''}}render();status.textContent='Program guide loaded. Current live-channel programs updated.'}
async function loadFallbackEpg(){try{let requested=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel')).map(c=>({name:c.name,tvgId:c.tvgId,tvgName:c.tvgName}));let r=await fetch('/api/epg-fallback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channels:requested}),cache:'no-store'});if(!r.ok)return;let j=await r.json(),rows=j.channels||[],matched=0,exact=0,alias=0;const norm2=x=>(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim();const live=ch=>(ch.group||'').toLowerCase().includes('live channel');epgCandidates=j.candidates||[];epgFound=j.foundChannels||[];for(const ch of channels){ch.epgGuideAvailable=!!(ch.epgMatchType==='direct'&&ch.epgNow);let n=norm2(ch.name||ch.tvgName||''),id=String(ch.tvgId||'').toLowerCase();if(epgFound.some(x=>(id&&String(x.requestedId||'').toLowerCase()===id)||(n&&norm2(x.requested||'')===n)))ch.epgGuideAvailable=true}for(let ch of channels){if(!live(ch))continue;if(ch.epgMatchType==='direct'&&ch.epgNow){matched++;exact++;continue}ch.epgNow=null;ch.epgMatchType='';ch.epgGuideId='';let ids=[ch.tvgId,ch.tvgName,ch.name].filter(Boolean).map(norm2);let hit=rows.find(x=>ids.some(v=>v&&[norm2(x.id),norm2(x.name)].includes(v)));if(!hit)hit=rows.find(x=>ids.some(v=>v&&norm2(x.name)===v));if(hit&&hit.title){ch.epgNow={title:hit.title};ch.epgMatchType=hit.id&&ch.tvgId&&norm2(hit.id)===norm2(ch.tvgId)?'exact':'alias';ch.epgGuideId=hit.id||'';matched++;ch.epgMatchType==='exact'?exact++:alias++}}render();let unmatched=channels.filter(ch=>live(ch)&&!ch.epgNow).length;status.textContent='EPG loaded • '+matched+' live channels matched • Exact '+exact+' • Alias '+alias+' • '+unmatched+' unmatched • '+(j.sources||0)+' guide sources.'}catch(e){console.warn('Fallback EPG unavailable',e)}}function addRecent(c){recent=[c.url,...recent.filter(x=>x!==c.url)].slice(0,15);localStorage.setItem('sv_recent',JSON.stringify(recent))}
function fillSelect(el,label,vals){let cur=el.value;el.innerHTML='<option value="">'+label+'</option>';for(let x of vals){let o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o)}if(vals.includes(cur))el.value=cur}
function buildSports(){fillSelect(sport,'All sports',[...new Set(channels.map(c=>c.sport))].sort());buildLeagues()}
function buildLeagues(){let sp=sport.value,a=channels.filter(c=>!sp||c.sport===sp);fillSelect(league,'All leagues',[...new Set(a.map(c=>c.league))].sort())}
function visible(){let q=search.value.trim().toLowerCase(),sp=sport.value,lg=league.value,a=channels;if(tab==='fav')a=a.filter(c=>fav.has(c.url));if(tab==='recent')a=recent.map(u=>channels.find(c=>c.url===u)).filter(Boolean);return a.filter(c=>(!sp||c.sport===sp)&&(!lg||c.league===lg)&&(!q||(c.name+' '+c.group+' '+c.sport+' '+c.league).toLowerCase().includes(q))).sort((a,b)=>{let ad=a.game?new Date(a.game.date).getTime():Infinity,bd=b.game?new Date(b.game.date).getTime():Infinity;return ad-bd})}
function choose(c){selected=c;$('#now').textContent=c.name+(c.group?' • '+c.group:'');let live=c.game?.competitions?.[0]?.status?.type?.state||c.game?.status?.type?.state||'';status.textContent=live==='in'?'Now playing: '+(c.game?.name||c.game?.shortName||c.name):'Playing: '+c.name;addRecent(c);video.pause();video.src=c.url;video.load();video.play().catch(()=>{status.textContent='Stream selected. Tap Play in the video controls if needed.'});render()}
function render(){list.innerHTML='';let a=visible();if(!a.length){list.innerHTML='<div class="status">No streams match this filter.</div>';return}for(let c of a){let r=document.createElement('div');r.className='item'+(selected&&selected.url===c.url?' selected':'');let i=document.createElement('div');i.className='info';let t=document.createElement('div');t.className='title';t.textContent=c.name;let g=document.createElement('div');g.className='group';g.textContent=c.group||'Channel';let sp=document.createElement('div');sp.className='sport';sp.textContent=c.league||c.sport;let gt=document.createElement('div');gt.className='gametime';let tl=timeLabel(c);gt.textContent=tl||((c.group||'').toLowerCase().includes('live channel')?'':'Time unavailable');if(tl==='LIVE')gt.classList.add('live');if(!tl)gt.classList.add('unknown');let np=document.createElement('div');np.className='nowplaying';let liveState=c.game?.competitions?.[0]?.status?.type?.state||c.game?.status?.type?.state||'';if(liveState==='in'){let evName=c.game?.name||c.game?.shortName||c.game?.competitions?.[0]?.name||c.name;np.textContent='Now Playing • '+evName;np.classList.add('liveNow')}else if(c.epgNow){np.textContent='Now Playing • '+c.epgNow.title;np.classList.add('liveNow')}else if((c.group||'').toLowerCase().includes('live channel')){np.textContent=c.epgGuideAvailable?'Guide available • no current program':(epgSource?'Guide loaded • no current program match':'Program guide unavailable')}else if(c.game){let evName=c.game?.name||c.game?.shortName||'';if(evName&&evName!==c.name)np.textContent='Next • '+evName}i.append(t,g,sp,np,gt);i.onclick=()=>choose(c);let s=document.createElement('button');s.className='star';s.textContent=fav.has(c.url)?'★':'☆';s.onclick=e=>{e.stopPropagation();fav.has(c.url)?fav.delete(c.url):fav.add(c.url);localStorage.setItem('sv_fav',JSON.stringify([...fav]));render()};let b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=e=>{e.stopPropagation();choose(c)};r.append(i,s,b);list.append(r)}}
async function sendDiagnostic(){try{let live=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel'));let matched=live.filter(c=>c.epgNow);let payload={version:'1.7.1',imported:channels.length,liveChannels:live.length,matched:matched.length,unmatched:live.filter(c=>!c.epgNow).map(c=>({name:c.name,tvgId:c.tvgId,tvgName:c.tvgName,group:c.group})),matchedChannels:matched.map(c=>({name:c.name,tvgId:c.tvgId,tvgName:c.tvgName,program:c.epgNow?.title||'',matchType:c.epgMatchType||'unknown',guideId:c.epgGuideId||'',group:c.group})),gamesMatched:channels.filter(c=>c.game).length,epgCandidates,epgFound,time:new Date().toISOString()};await fetch('/api/diagnostic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true});}catch(e){console.warn('Diagnostic upload failed',e)}}
async function imp(){let u=safe($('#url').value.trim());if(!u){status.textContent='Enter a valid https:// app2 playlist URL.';return}$('#import').disabled=true;status.textContent='Importing…';try{let r=await fetch('/api/playlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u}),cache:'no-store'});if(!r.ok)throw Error(r.status);channels=parse(await r.text());if(!channels.length)throw Error('No channels');localStorage.setItem('streamview_playlist_url',u);let epgPromise=epgSource?loadEpg(epgSource).catch(e=>console.warn('EPG unavailable',e)):Promise.resolve();search.disabled=false;sport.disabled=false;league.disabled=false;buildSports();render();status.textContent='Imported '+channels.length+' streams'+(epgSource?' • program guide detected':' • loading automatic program guide')+'…';loadSchedules().then(async()=>{await epgPromise;await loadFallbackEpg();await sendDiagnostic();render();let matched=channels.filter(c=>c.game).length,epgMatched=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel')&&c.epgNow).length,epgCovered=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel')&&(c.epgNow||c.epgGuideAvailable)).length;status.textContent='Imported '+channels.length+' streams • '+matched+' feeds matched to game times • EPG '+epgMatched+' current / '+epgCovered+' covered.'}).catch(async e=>{console.warn('Schedule matching failed',e);await epgPromise;await loadFallbackEpg();await sendDiagnostic();let epgMatched=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel')&&c.epgNow).length,epgCovered=channels.filter(c=>(c.group||'').toLowerCase().includes('live channel')&&(c.epgNow||c.epgGuideAvailable)).length;status.textContent='Imported '+channels.length+' streams • Game times unavailable • EPG '+epgMatched+' current / '+epgCovered+' covered.'})}catch(e){console.error(e);status.textContent='Playlist import failed. Check the address and try again.'}finally{$('#import').disabled=false}}
$('#import').onclick=imp;search.oninput=render;sport.onchange=()=>{buildLeagues();render()};league.onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');let saved=localStorage.getItem('streamview_playlist_url');if(saved)$('#url').value=saved;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
