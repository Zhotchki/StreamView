<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>StreamView</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{display:flex;align-items:center;padding:13px;background:#13171c;position:sticky;top:0;z-index:5}.brand{flex:1;font-size:20px;font-weight:800}.ver{font-size:11px;color:#929aa4}
.btn{border:0;border-radius:11px;background:#272d34;color:#fff;padding:11px 13px;font-weight:700;min-height:44px}.primary{background:#fff;color:#111}.btn:disabled{opacity:.4}
main{max-width:900px;margin:auto;padding:10px}.player{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}video{width:100%;height:100%;display:block}
.now{font-weight:750;padding:10px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#15191e;border:1px solid #2a3037;border-radius:15px;padding:12px;margin-bottom:10px}.label,.status{font-size:13px;color:#aab3bd}
.row{display:flex;gap:8px;margin-top:6px}input,select{width:100%;min-width:0;border:1px solid #343b43;background:#0e1115;color:#fff;border-radius:11px;padding:12px;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tabs{display:flex;gap:7px;margin:8px 0}.tabs .btn{flex:1}.active{background:#fff!important;color:#111!important}
.list{display:grid;gap:6px;max-height:48vh;overflow:auto}.item{display:flex;align-items:center;gap:8px;background:#0e1115;border:1px solid #282e35;border-radius:11px;padding:9px}
.info{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:12px;color:#929aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;color:#fff;font-size:22px}.hidden{display:none}.selected{border-color:#fff}.sport{font-size:11px;color:#c2cad3;margin-top:2px}
@media(orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.list{max-height:calc(100dvh - 230px)}}
</style></head><body>
<header><div class="brand">StreamView <span class="ver">v1.3.2</span></div><button class="btn" id="settingsBtn">Settings</button></header>
<main><section>
<div class="player"><video id="video" playsinline controls preload="metadata" x-webkit-airplay="allow"></video></div>
<div class="now" id="now">Choose a channel</div>
<div class="status" style="padding:0 2px 10px">Tap a stream below to play it. Use the AirPlay/output button inside the video controls to send video directly to your TV.</div>
</section><section>
<div class="card" id="settings"><div class="label">Uzzu app2 playlist URL</div><div class="row"><input id="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email"><button class="btn primary" id="import">Import</button></div><p class="status" id="status">Your personal playlist address is stored only in this browser.</p></div>
<div class="card">
<div class="filters"><input id="search" type="search" placeholder="Search teams/channels" disabled><select id="sport" disabled><option value="">All sports</option></select></div><div style="margin-bottom:8px"><select id="league" disabled><option value="">All leagues</option></select></div>
<div class="tabs"><button class="btn active" data-tab="all">All</button><button class="btn" data-tab="fav">Favorites</button><button class="btn" data-tab="recent">Recent</button></div>
<div class="list" id="list"><div class="status">Import your playlist to load channels.</div></div>
</div></section></main>
<script>
(()=>{const $=s=>document.querySelector(s),PROXY='https://dualview-proxy.zhotchki.workers.dev/?url=';
let channels=[],selected=null,tab='all',scheduleEvents=[];const video=$('#video'),list=$('#list'),status=$('#status'),search=$('#search'),sport=$('#sport'),league=$('#league');
let fav=new Set(JSON.parse(localStorage.getItem('sv_fav')||'[]')),recent=JSON.parse(localStorage.getItem('sv_recent')||'[]');

function safe(x){try{let u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return''}}
function classify(c){
 const x=(c.group+' '+c.name).toLowerCase();
 const rules=[
 ['Football','NFL',/\bnfl\b|redzone|red zone/],['Football','NCAA Football',/\bcfb\b|college football|ncaa football/],
 ['Baseball','MLB',/\bmlb\b|baseball/],['Basketball','NBA',/\bnba\b/],['Basketball','NCAA Basketball',/\bncaab\b|college basketball/],
 ['Hockey','NHL',/\bnhl\b|hockey/],['Golf','PGA / Golf',/\bpga\b|golf|liv golf/],['MMA','UFC / MMA',/\bufc\b|\bmma\b/],
 ['Soccer','MLS',/\bmls\b/],['Soccer','Premier League',/premier league|\bepl\b/],['Soccer','Champions League',/champions league/],
 ['Soccer','Soccer',/soccer|fifa|la liga|serie a|bundesliga/],['Tennis','Tennis',/tennis|\batp\b|\bwta\b/],
 ['Racing','NASCAR',/\bnascar\b/],['Racing','Formula 1',/formula 1|\bf1\b/],['Racing','Racing',/indycar|racing/]];
 for(const [sport,league,re] of rules)if(re.test(x))return {sport,league};
 return {sport:(c.group.trim()||'Other'),league:(c.group.trim()||'Other')};
}
const SCOREBOARDS={
 'NFL':'football/nfl','NCAA Football':'football/college-football','MLB':'baseball/mlb','NBA':'basketball/nba','NCAA Basketball':'basketball/mens-college-basketball','NHL':'hockey/nhl','MLS':'soccer/usa.1','Premier League':'soccer/eng.1','PGA / Golf':'golf/pga','UFC / MMA':'mma/ufc'
};
function norm(x){return (x||'').toLowerCase().replace(/\s*-\s*[ha]\s*$/i,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function teamKeys(team){let a=[];if(!team)return a;for(let k of ['name','shortDisplayName','displayName','abbreviation','location'])if(team[k])a.push(norm(team[k]));return [...new Set(a.filter(k=>k.length>=2))]}
function matchupParts(c){let raw=(c.name||'').replace(/\s*-\s*[HA]\s*$/i,'').trim();let p=raw.split(/\s+(?:@|at|vs\.?|v)\s+/i);return p.length===2?p.map(norm):[]}
function partMatchesTeam(part,team){if(!part)return false;return teamKeys(team).some(k=>part===k||part.endsWith(' '+k)||k.endsWith(' '+part)||part.includes(k))}
function matchEvent(c,e){let comp=e.competitions?.[0]?.competitors||[];if(comp.length<2)return false;let parts=matchupParts(c);if(parts.length===2){let t0=comp[0].team||{},t1=comp[1].team||{};return (partMatchesTeam(parts[0],t0)&&partMatchesTeam(parts[1],t1))||(partMatchesTeam(parts[0],t1)&&partMatchesTeam(parts[1],t0))}let n=norm(c.name+' '+c.group),hits=0;for(let x of comp){if(teamKeys(x.team).some(k=>n.includes(k)))hits++}return hits>=2}
function attachTimes(){for(let c of channels){c.game=null;let candidates=scheduleEvents.filter(e=>!c.league||e._league===c.league);let hit=candidates.find(e=>matchEvent(c,e));if(hit)c.game=hit}}
function timeLabel(c){let e=c.game;if(!e)return '';let st=e.competitions?.[0]?.status?.type||e.status?.type||{};let state=st.state||'';if(state==='in')return 'LIVE';let d=new Date(e.date);if(isNaN(d))return '';let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()),diff=Math.round((day-today)/86400000);let prefix=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});return prefix+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
async function loadSchedules(){scheduleEvents=[];let leagues=[...new Set(channels.map(c=>c.league).filter(l=>SCOREBOARDS[l]))];let now=new Date(),to=new Date(now.getTime()+8*86400000);let f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),range=f(new Date(now.getTime()-86400000))+'-'+f(to);await Promise.all(leagues.map(async l=>{try{let ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
let r=await fetch('https://streamview-schedule.zhotchki.workers.dev/?sport='+encodeURIComponent(SCOREBOARDS[l])+'&dates='+encodeURIComponent(range),{cache:'no-store',signal:ctl.signal});
clearTimeout(tm);if(!r.ok)return;let j=await r.json();for(let e of (j.events||[])){e._league=l;scheduleEvents.push(e)}}catch(e){console.warn('Schedule unavailable',l,e)}}));attachTimes()}
function parse(t){let out=[],m=null;for(let r of t.replace(/\r/g,'').split('\n')){let l=r.trim();if(!l)continue;if(l.startsWith('#EXTINF:')){let c=l.lastIndexOf(',');m={name:(c>=0?l.slice(c+1):'Channel').trim()||'Channel',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||''}}else if(!l.startsWith('#')&&m){let u=safe(l);if(u){let x={...m,url:u};let cl=classify(x);x.sport=cl.sport;x.league=cl.league;out.push(x)}m=null}}return out}
function addRecent(c){recent=[c.url,...recent.filter(x=>x!==c.url)].slice(0,15);localStorage.setItem('sv_recent',JSON.stringify(recent))}
function fillSelect(el,label,vals){let cur=el.value;el.innerHTML='<option value="">'+label+'</option>';for(let x of vals){let o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o)}if(vals.includes(cur))el.value=cur}
function buildSports(){fillSelect(sport,'All sports',[...new Set(channels.map(c=>c.sport))].sort());buildLeagues()}
function buildLeagues(){let sp=sport.value,a=channels.filter(c=>!sp||c.sport===sp);fillSelect(league,'All leagues',[...new Set(a.map(c=>c.league))].sort())}
function visible(){let q=search.value.trim().toLowerCase(),sp=sport.value,lg=league.value,a=channels;if(tab==='fav')a=a.filter(c=>fav.has(c.url));if(tab==='recent')a=recent.map(u=>channels.find(c=>c.url===u)).filter(Boolean);return a.filter(c=>(!sp||c.sport===sp)&&(!lg||c.league===lg)&&(!q||(c.name+' '+c.group+' '+c.sport+' '+c.league).toLowerCase().includes(q))).sort((a,b)=>{let ad=a.game?new Date(a.game.date).getTime():Infinity,bd=b.game?new Date(b.game.date).getTime():Infinity;return ad-bd})}
function choose(c){selected=c;$('#now').textContent=c.name+(c.group?' • '+c.group:'');status.textContent='Playing: '+c.name;addRecent(c);video.pause();video.src=c.url;video.load();video.play().catch(()=>{status.textContent='Stream selected. Tap Play in the video controls if needed.'});render()}
function render(){list.innerHTML='';let a=visible();if(!a.length){list.innerHTML='<div class="status">No streams match this filter.</div>';return}for(let c of a){let r=document.createElement('div');r.className='item'+(selected&&selected.url===c.url?' selected':'');let i=document.createElement('div');i.className='info';let t=document.createElement('div');t.className='title';t.textContent=c.name;let g=document.createElement('div');g.className='group';g.textContent=c.group||'Channel';let sp=document.createElement('div');sp.className='sport';sp.textContent=c.league||c.sport;let gt=document.createElement('div');gt.className='gametime';let tl=timeLabel(c);gt.textContent=tl||'Time unavailable';if(tl==='LIVE')gt.classList.add('live');if(!tl)gt.classList.add('unknown');i.append(t,g,sp,gt);i.onclick=()=>choose(c);let s=document.createElement('button');s.className='star';s.textContent=fav.has(c.url)?'★':'☆';s.onclick=e=>{e.stopPropagation();fav.has(c.url)?fav.delete(c.url):fav.add(c.url);localStorage.setItem('sv_fav',JSON.stringify([...fav]));render()};let b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=e=>{e.stopPropagation();choose(c)};r.append(i,s,b);list.append(r)}}
async function imp(){let u=safe($('#url').value.trim());if(!u){status.textContent='Enter a valid https:// app2 playlist URL.';return}$('#import').disabled=true;status.textContent='Importing…';try{let r=await fetch(PROXY+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error(r.status);channels=parse(await r.text());if(!channels.length)throw Error('No channels');localStorage.setItem('streamview_playlist_url',u);search.disabled=false;sport.disabled=false;league.disabled=false;buildSports();render();status.textContent='Imported '+channels.length+' streams. Matching game times…'}catch(e){console.error(e);status.textContent='Playlist import failed. Check the address and try again.'}finally{$('#import').disabled=false}}
$('#import').onclick=imp;search.oninput=render;sport.onchange=()=>{buildLeagues();render()};league.onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');let saved=localStorage.getItem('streamview_playlist_url');if(saved)$('#url').value=saved;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
