<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>StreamView</title>
<style>
*{box-sizing:border-box}html{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}body{margin:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;background:#090b0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}main,header,.card,.player,.row,.filters,.tabs,.list{min-width:0;max-width:100%}.list{overflow-x:hidden;overscroll-behavior-x:contain;touch-action:pan-y}.item{min-width:0;max-width:100%}.item>.btn{flex-shrink:0}.tabs .btn{min-width:0}
header{display:flex;align-items:center;padding:13px;background:#13171c;position:sticky;top:0;z-index:5}.brand{flex:1;font-size:20px;font-weight:800}.ver{font-size:11px;color:#929aa4}
.btn{border:0;border-radius:11px;background:#272d34;color:#fff;padding:11px 13px;font-weight:700;min-height:44px}.primary{background:#fff;color:#111}.btn:disabled{opacity:.4}
main{max-width:900px;margin:auto;padding:10px}.player{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}video{width:100%;height:100%;display:block}
.now{font-weight:750;padding:10px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:#15191e;border:1px solid #2a3037;border-radius:15px;padding:12px;margin-bottom:10px}.label,.status{font-size:13px;color:#aab3bd}
.row{display:flex;gap:8px;margin-top:6px}input,select{width:100%;min-width:0;border:1px solid #343b43;background:#0e1115;color:#fff;border-radius:11px;padding:12px;font-size:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tabs{display:flex;gap:7px;margin:8px 0}.tabs .btn{flex:1}.active{background:#fff!important;color:#111!important}
.list{display:grid;gap:6px;max-height:48vh;overflow:auto}.item{display:flex;align-items:center;gap:8px;background:#0e1115;border:1px solid #282e35;border-radius:11px;padding:9px}
.info{flex:1;min-width:0}.title{font-weight:750;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:normal;line-height:1.35}.group{font-size:12px;color:#929aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;color:#fff;font-size:22px}.hidden{display:none}.selected{border-color:#fff}.sport{font-size:11px;color:#c2cad3;margin-top:2px}
@media(orientation:landscape){main{max-width:none;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.list{max-height:calc(100dvh - 230px)}}
</style></head><body>
<header><div class="brand">StreamView <span class="ver">v1.3.7</span></div><button class="btn" id="settingsBtn">Settings</button></header>
<main><section>
<div class="player"><video id="video" playsinline controls preload="metadata" x-webkit-airplay="allow"></video></div>
<div class="now" id="now">Choose a channel</div>
<div class="status" style="padding:0 2px 10px">Tap a stream below to play it. Use the AirPlay/output button inside the video controls to send video directly to your TV.</div>
</section><section>
<div class="card" id="settings"><div class="label">Uzzu app2 playlist URL</div><div class="row"><input id="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email"><button class="btn primary" id="import">Import</button></div><p class="status" id="status">Your personal playlist address is stored only in this browser.</p></div>
<div class="card">
<div class="filters"><input id="search" type="search" placeholder="Search teams/channels" disabled><select id="sport" disabled><option value="">All sports</option></select></div><div class="filters" style="margin-bottom:8px"><select id="gameType" disabled><option value="">All channels</option><option value="live">Live games</option><option value="other">Other channels</option></select><select id="league" disabled><option value="">All leagues</option></select></div>
<div class="tabs"><button class="btn active" data-tab="all">All</button><button class="btn" data-tab="fav">Favorites</button><button class="btn" data-tab="recent">Recent</button></div>
<div class="list" id="list"><div class="status">Import your playlist to load channels.</div></div>
</div></section></main>
<script>
(()=>{const $=s=>document.querySelector(s),PROXY='/api/playlist';
let channels=[],selected=null,tab='all',scheduleEvents=[];const video=$('#video'),list=$('#list'),status=$('#status'),search=$('#search'),sport=$('#sport'),league=$('#league'),gameType=$('#gameType');
let fav=new Set(JSON.parse(localStorage.getItem('sv_fav')||'[]')),recent=JSON.parse(localStorage.getItem('sv_recent')||'[]');

function safe(x){try{let u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return''}}
const TEAM_HINTS={
 NFL:'cardinals falcons ravens bills panthers bears bengals browns cowboys broncos lions packers texans colts jaguars chiefs raiders chargers rams dolphins vikings patriots saints giants jets eagles steelers 49ers seahawks buccaneers titans commanders',
 MLB:'diamondbacks braves orioles red sox cubs white sox reds guardians rockies tigers astros royals angels dodgers marlins brewers twins mets yankees athletics phillies pirates padres giants mariners cardinals rays rangers blue jays nationals',
 NHL:'ducks bruins sabres flames hurricanes blackhawks avalanche blue jackets stars red wings oilers panthers kings wild canadiens predators devils islanders rangers senators flyers penguins sharks kraken blues lightning maple leafs canucks golden knights capitals jets',
 NBA:'hawks celtics nets hornets bulls cavaliers mavericks nuggets pistons warriors rockets pacers clippers lakers grizzlies heat bucks timberwolves pelicans knicks thunder magic 76ers suns trail blazers kings spurs raptors jazz wizards'
};
const TEAM_PHRASES={
 NFL:['49ers','new york giants','new york jets','green bay packers','kansas city chiefs','san francisco 49ers','tampa bay buccaneers','washington commanders'],
 MLB:['red sox','white sox','blue jays','diamondbacks','guardians','brewers','yankees','mets','phillies','dodgers'],
 NHL:['maple leafs','golden knights','blue jackets','red wings','new york rangers','new york islanders','new jersey devils','tampa bay lightning','seattle kraken'],
 NBA:['trail blazers','76ers','timberwolves','cavaliers','knicks','mavericks','warriors']
};
const TEAM_WORDS=Object.fromEntries(Object.entries(TEAM_HINTS).map(([league,str])=>[league,str.split(/\s+/)]));
function teamEvidence(name,league){const n=' '+(name||'').toLowerCase().replace(/[^a-z0-9]+/g,' ')+' ';const phrases=(TEAM_PHRASES[league]||[]).filter(t=>n.includes(' '+t+' '));const words=TEAM_WORDS[league].filter(w=>n.includes(' '+w+' '));return new Set([...phrases,...words]).size}
function classify(c){
 const x=(c.group+' '+c.name).toLowerCase(),group=(c.group||'').toLowerCase(),name=c.name||'';
 const explicit=[
 ['Football','NFL',/\bnfl\b|redzone|red zone/],
 ['Football','NCAA Football',/\bcfb\b|college football|ncaa football/],
 ['Baseball','MLB',/\bmlb\b|baseball/],
 ['Basketball','NBA',/\bnba\b/],
 ['Basketball','NCAA Basketball',/\bncaab\b|college basketball/],
 ['Hockey','NHL',/\bnhl\b|hockey/],
 ['Golf','PGA / Golf',/\bpga\b|golf|liv golf/],
 ['MMA','UFC / MMA',/\bufc\b|\bmma\b/],
 ['Soccer','MLS',/\bmls\b/],
 ['Soccer','Premier League',/premier league|\bepl\b/],
 ['Soccer','Champions League',/champions league/],
 ['Soccer','Soccer',/soccer|fifa|la liga|serie a|bundesliga/],
 ['Tennis','Tennis',/tennis|\batp\b|\bwta\b/],
 ['Racing','NASCAR',/\bnascar\b/],
 ['Racing','Formula 1',/formula 1|\bf1\b/],
 ['Racing','Racing',/indycar|racing/]
 ];
 for(const [sport,league,re] of explicit)if(re.test(x))return {sport,league};
 if(/live[ -]?games?|live[ -]?sports?/i.test(group)){
  const scores=['NFL','MLB','NHL','NBA'].map(l=>({league:l,count:teamEvidence(name,l)})).sort((a,b)=>b.count-a.count);
  if(scores[0].count>=2&&scores[0].count>scores[1].count){const league=scores[0].league;return {sport:{NFL:'Football',MLB:'Baseball',NHL:'Hockey',NBA:'Basketball'}[league],league}}
  if(scores[0].count===1&&scores[1].count===0){const league=scores[0].league;return {sport:{NFL:'Football',MLB:'Baseball',NHL:'Hockey',NBA:'Basketball'}[league],league}}
 }
 return {sport:(c.group.trim()||'Other'),league:(c.group.trim()||'Other')};
}
const SCOREBOARDS={
 'NFL':'football/nfl','NCAA Football':'football/college-football','MLB':'baseball/mlb','NBA':'basketball/nba','NCAA Basketball':'basketball/mens-college-basketball','NHL':'hockey/nhl','MLS':'soccer/usa.1','Premier League':'soccer/eng.1','PGA / Golf':'golf/pga','UFC / MMA':'mma/ufc'
};
function norm(x){return (x||'').toLowerCase().replace(/\s*-\s*[ha]\s*$/i,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function teamKeys(team){let a=[];if(!team)return a;for(let k of ['name','shortDisplayName','displayName','abbreviation','location'])if(team[k])a.push(norm(team[k]));const full=norm(team.displayName||'');if(full){const pieces=full.split(' ');if(pieces.length>1)a.push(pieces[pieces.length-1]);}return [...new Set(a.filter(k=>k.length>=2))]}
function matchupParts(c){let raw=(c.name||'').replace(/\s*-\s*[HA]\s*$/i,'').trim();let p=raw.split(/\s+(?:@|at|vs\.?|v)\s+/i);return p.length===2?p.map(norm):[]}
function partMatchesTeam(part,team){if(!part)return false;return teamKeys(team).some(k=>part===k||part.endsWith(' '+k)||k.endsWith(' '+part)||part.includes(' '+k+' ')||k.includes(' '+part+' '))}
function matchEvent(c,e){let comp=e.competitions?.[0]?.competitors||[];if(comp.length<2)return false;let parts=matchupParts(c);if(parts.length===2){let t0=comp[0].team||{},t1=comp[1].team||{};return (partMatchesTeam(parts[0],t0)&&partMatchesTeam(parts[1],t1))||(partMatchesTeam(parts[0],t1)&&partMatchesTeam(parts[1],t0))}let n=norm(c.name),hits=0;for(let x of comp){if(teamKeys(x.team).some(k=>k.length>=3&&(n===k||n.includes(' '+k+' ')||n.startsWith(k+' ')||n.endsWith(' '+k))))hits++}return hits>=2}

function attachTimes(){for(let c of channels){c.game=null;let candidates=scheduleEvents.filter(e=>e._league===c.league&&matchEvent(c,e));if(candidates.length){let now=Date.now(),rank=e=>{let state=(e.competitions?.[0]?.status?.type||e.status?.type||{}).state||'';return state==='in'?0:new Date(e.date).getTime()>=now?1:2};candidates.sort((a,b)=>{let ar=rank(a),br=rank(b),at=new Date(a.date).getTime(),bt=new Date(b.date).getTime();return ar-br||(ar===1?at-bt:bt-at)});c.game=candidates[0]}}}

function timeLabel(c){let e=c.game;if(!e)return '';let st=e.competitions?.[0]?.status?.type||e.status?.type||{};let state=st.state||'';if(state==='in')return 'LIVE';let d=new Date(e.date);if(isNaN(d))return '';let now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()),diff=Math.round((day-today)/86400000);let prefix=diff===0?'Today':diff===1?'Tomorrow':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});return prefix+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
async function loadSchedules(){
 scheduleEvents=[];
 let needsLive=channels.some(c=>/live[ -]?games?/i.test(c.group||''));
 let core=needsLive?['NFL','MLB','NHL','NBA']:[];
 let leagues=[...new Set([...core,...channels.map(c=>c.league)].filter(l=>SCOREBOARDS[l]))];
 let now=new Date(),to=new Date(now.getTime()+8*86400000);
 let f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),range=f(new Date(now.getTime()-86400000))+'-'+f(to);
 const results=await Promise.all(leagues.map(async l=>{let ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),18000);try{
  let r=await fetch('/api/schedule?sport='+encodeURIComponent(SCOREBOARDS[l])+'&dates='+encodeURIComponent(range),{cache:'no-store',signal:ctl.signal});
  if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();return {league:l,events:j.events||[]};
 }catch(e){console.warn('Schedule unavailable',l,e);return {league:l,events:[],failed:true}}finally{clearTimeout(tm)}}));
 for(let result of results)for(let e of result.events){e._league=result.league;scheduleEvents.push(e)}
 // Unlabeled Live-Games entries can be assigned only when their matchup uniquely matches a scheduled league.
 for(let c of channels){if(!/live[ -]?games?/i.test(c.group||'')||SCOREBOARDS[c.league])continue;let leaguesMatched=[...new Set(scheduleEvents.filter(e=>matchEvent(c,e)).map(e=>e._league))];if(leaguesMatched.length===1&&['NFL','MLB','NHL','NBA'].includes(leaguesMatched[0])){c.league=leaguesMatched[0];c.sport={NFL:'Football',MLB:'Baseball',NHL:'Hockey',NBA:'Basketball'}[c.league]}}
 attachTimes();buildSports();render();
 let failed=results.filter(r=>r.failed).map(r=>r.league);
 let matched=channels.filter(c=>c.game).length;
 status.textContent='Loaded '+channels.length+' streams • '+matched+' game times matched'+(failed.length?' • schedule unavailable: '+failed.join(', '):'');
}
function isReplayGame(c){return /\b(replay|replays|rebroadcast|re-air|reair|encore)\b/i.test((c.group||'')+' '+(c.name||''))}
function parse(t){let out=[],m=null;for(let r of t.replace(/\r/g,'').split('\n')){let l=r.trim();if(!l)continue;if(l.startsWith('#EXTINF:')){let c=l.lastIndexOf(',');m={name:(c>=0?l.slice(c+1):'Channel').trim()||'Channel',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||''}}else if(!l.startsWith('#')&&m){let u=safe(l);if(u&&!isReplayGame(m)){let x={...m,url:u};let cl=classify(x);x.sport=cl.sport;x.league=cl.league;out.push(x)}m=null}}return out}
function addRecent(c){recent=[c.url,...recent.filter(x=>x!==c.url)].slice(0,15);localStorage.setItem('sv_recent',JSON.stringify(recent))}
function isLiveGame(c){return /live[ -]?games?|live[ -]?sports?/i.test(c.group||'')}
function matchesGameType(c){return !gameType.value||(gameType.value==='live'?isLiveGame(c):!isLiveGame(c))}
function fillSelect(el,label,vals){let cur=el.value;el.innerHTML='<option value="">'+label+'</option>';for(let x of vals){let o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o)}if(vals.includes(cur))el.value=cur}
function buildSports(){fillSelect(sport,'All sports',[...new Set(channels.filter(matchesGameType).map(c=>c.sport))].sort());buildLeagues()}
function buildLeagues(){let sp=sport.value,a=channels.filter(c=>matchesGameType(c)&&(!sp||c.sport===sp));fillSelect(league,'All leagues',[...new Set(a.map(c=>c.league))].sort())}
function isNflAlternate(c){return /\\b(all[- ]?22|manningcast|alternate|alt feed|coach(?:es)? film|skycam|prime vision)\\b/i.test(c.name||'')}
function nflMatchupKey(c){
 if(c.league!=='NFL'||isNflAlternate(c))return '';
 let parts=matchupParts(c);
 if(parts.length===2)return parts.slice().sort().join('|');
 if(!c.game)return '';
 let teams=(c.game.competitions?.[0]?.competitors||[]).map(x=>norm(x.team?.displayName||x.team?.name||'')).filter(Boolean);
 return teams.length===2?teams.sort().join('|'):'';
}
function preferredNflFeed(c){let n=c.name||'';return (/\\s-\\s[HA]\\s*$/i.test(n)?0:10)+(fav.has(c.url)?2:0)+(selected?.url===c.url?1:0)}
function dedupeNflGames(items){
 const chosen=new Map(),out=[];
 for(let c of items){let key=nflMatchupKey(c);if(!key){out.push(c);continue}
 if(!chosen.has(key)){chosen.set(key,{channel:c,index:out.length});out.push(c)}
 else{let prev=chosen.get(key);if(preferredNflFeed(c)>preferredNflFeed(prev.channel)){out[prev.index]=c;prev.channel=c}}
 }
 return out;
}
function visible(){let q=search.value.trim().toLowerCase(),sp=sport.value,lg=league.value,a=channels;if(tab==='fav')a=a.filter(c=>fav.has(c.url));if(tab==='recent')a=recent.map(u=>channels.find(c=>c.url===u)).filter(Boolean);let filtered=a.filter(c=>!isReplayGame(c)&&matchesGameType(c)&&(!sp||c.sport===sp)&&(!lg||c.league===lg)&&(!q||(c.name+' '+c.group+' '+c.sport+' '+c.league).toLowerCase().includes(q)));return dedupeNflGames(filtered).sort((a,b)=>{let ad=a.game?new Date(a.game.date).getTime():Infinity,bd=b.game?new Date(b.game.date).getTime():Infinity;return ad-bd})}
function choose(c){selected=c;$('#now').textContent=c.name+(c.group?' • '+c.group:'');status.textContent='Playing: '+c.name;addRecent(c);video.pause();video.src=c.url;video.load();video.play().catch(()=>{status.textContent='Stream selected. Tap Play in the video controls if needed.'});render()}
function render(){list.innerHTML='';let a=visible();if(!a.length){list.innerHTML='<div class="status">No streams match this filter.</div>';return}for(let c of a){let r=document.createElement('div');r.className='item'+(selected&&selected.url===c.url?' selected':'');let i=document.createElement('div');i.className='info';let t=document.createElement('div');t.className='title';t.textContent=c.league==='NFL'&&!isNflAlternate(c)?c.name.replace(/\\s-\\s[HA]\\s*$/i,''):c.name;let g=document.createElement('div');g.className='group';g.textContent=c.group||'Channel';let sp=document.createElement('div');sp.className='sport';sp.textContent=c.league||c.sport;let gt=document.createElement('div');gt.className='gametime';let tl=timeLabel(c);gt.textContent=tl||'Time unavailable';if(tl==='LIVE')gt.classList.add('live');if(!tl)gt.classList.add('unknown');i.append(t,g,sp,gt);i.onclick=()=>choose(c);let s=document.createElement('button');s.className='star';s.textContent=fav.has(c.url)?'★':'☆';s.onclick=e=>{e.stopPropagation();fav.has(c.url)?fav.delete(c.url):fav.add(c.url);localStorage.setItem('sv_fav',JSON.stringify([...fav]));render()};let b=document.createElement('button');b.className='btn';b.textContent='Select';b.onclick=e=>{e.stopPropagation();choose(c)};r.append(i,s,b);list.append(r)}}
async function imp(){let u=safe($('#url').value.trim());if(!u){status.textContent='Enter a valid https:// app2 playlist URL.';return}$('#import').disabled=true;status.textContent='Importing…';try{let r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u}),cache:'no-store'});if(!r.ok)throw Error(r.status);channels=parse(await r.text());if(!channels.length)throw Error('No channels');localStorage.setItem('streamview_playlist_url',u);try{localStorage.setItem('sv_playlist_cache',JSON.stringify(channels))}catch(e){console.warn('Playlist cache unavailable',e)}search.disabled=false;sport.disabled=false;league.disabled=false;gameType.disabled=false;buildSports();render();status.textContent='Imported '+channels.length+' streams. Loading game times in background…';loadSchedules().then(()=>{render()}).catch(e=>{console.warn('Schedule matching failed',e);status.textContent='Imported '+channels.length+' streams. Game times unavailable right now.'})}catch(e){console.error(e);status.textContent='Playlist import failed. Check the address and try again.'}finally{$('#import').disabled=false}}
$('#import').onclick=imp;search.oninput=render;sport.onchange=()=>{buildLeagues();render()};gameType.onchange=()=>{buildSports();render()};league.onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
function restoreChannels(){try{let raw=localStorage.getItem('sv_playlist_cache');if(!raw)return;let data=JSON.parse(raw);if(!Array.isArray(data)||!data.length)return;channels=data.filter(c=>c&&typeof c.url==='string'&&typeof c.name==='string'&&!isReplayGame(c)).map(c=>{let x={name:c.name,group:c.group||'',url:c.url};return {...x,...classify(x)}});try{localStorage.setItem('sv_playlist_cache',JSON.stringify(channels))}catch(e){}if(!channels.length)return;search.disabled=false;sport.disabled=false;league.disabled=false;gameType.disabled=false;buildSports();render();status.textContent='Restored '+channels.length+' saved streams • loading game times…';loadSchedules().catch(e=>{console.warn('Schedule matching failed',e);status.textContent='Saved streams restored; game times unavailable.'})}catch(e){console.warn('Playlist restore unavailable',e)}}
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');let saved=localStorage.getItem('streamview_playlist_url');if(saved)$('#url').value=saved;restoreChannels();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
